syntax = "proto3";

option go_package = "github.com/DecarbonizedGlucose/rkv/internal/raft/proto;persistpb";

package persist;

import "api/raftrpc/consensus.proto";

message PersistState {
    int64 current_term = 1;
    int64 voted_for = 2;
    int64 last_included_index = 3;
    int64 last_included_term = 4;
    repeated raftrpc.LogEntry log = 5;
}
